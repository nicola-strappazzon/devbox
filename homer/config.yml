title: "DevBox"
subtitle: "Local Dev Stack"
icon: "fas fa-server"

header: true
footer: false

columns: 3
connectivityCheck: false

theme: default
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

services:
  - name: "Observability"
    icon: "fas fa-chart-line"
    items:
      - name: "Grafana"
        subtitle: "Dashboards"
        tag: ":3000"
        url: "http://devbox.local:3000"
        icon: "fas fa-chart-bar"

      - name: "OTel Collector"
        subtitle: "http://devbox.local:4317 token: devtoken"
        tag: "OTLP"
        icon: "fas fa-satellite-dish"

      - name: "Prometheus"
        subtitle: "Metrics store"
        tag: ":9090"
        url: "http://devbox.local:9090"
        icon: "fas fa-fire"

      - name: "Uptime Kuma"
        subtitle: "Uptime monitoring"
        tag: ":3001"
        url: "http://devbox.local:3001"
        icon: "fas fa-heartbeat"

  - name: "Databases"
    icon: "fas fa-database"
    items:
      - name: "ClickHouse"
        subtitle: "user: default pass: clickhouse"
        tag: ":8123"
        icon: "fas fa-bolt"

      - name: "MongoDB"
        subtitle: "mongodb://devbox.local:27017"
        tag: ":27017"
        icon: "fas fa-leaf"

      - name: "MySQL Primary"
        subtitle: "user: root pass: root"
        tag: ":3306"
        icon: "fas fa-database"

      - name: "MySQL Replica"
        subtitle: "user: root pass: root"
        tag: ":3307"
        icon: "fas fa-clone"

      - name: "Redis"
        subtitle: "devbox.local:6379"
        tag: ":6379"
        icon: "fas fa-memory"

      - name: "Redpanda"
        subtitle: "Kafka :19092 · Schema :18081 · Proxy :18082"
        tag: ":19092"
        icon: "fas fa-stream"

  - name: "Clients"
    icon: "fas fa-desktop"
    items:
      - name: "ClickHouse Play"
        subtitle: "user: default pass: clickhouse"
        tag: ":8123"
        url: "http://devbox.local:8123/play?user=default"
        icon: "fas fa-bolt"

      - name: "Portainer"
        subtitle: "user: admin pass: portainer123"
        tag: ":9002"
        url: "http://devbox.local:9002"
        icon: "fab fa-docker"

      - name: "Redis Insight"
        subtitle: "Browse keys, CLI, profiler"
        tag: ":5540"
        url: "http://devbox.local:5540"
        icon: "fas fa-memory"

      - name: "Redpanda Console"
        subtitle: "Topics, consumers, schemas"
        tag: ":8088"
        url: "http://devbox.local:8088"
        icon: "fas fa-stream"
