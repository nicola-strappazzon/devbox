title: "DevBox"
subtitle: "Local Dev Stack"
icon: "fas fa-server"

header: true
footer: false

columns: 3
connectivityCheck: false

theme: default
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

services:
  - name: "Observability"
    icon: "fas fa-chart-line"
    items:
      - name: "Grafana"
        subtitle: "admin / grafana"
        tag: ":3000"
        url: "http://devbox.local:3000"
        icon: "fas fa-chart-bar"

      - name: "Prometheus"
        subtitle: "Metrics store"
        tag: ":9090"
        url: "http://devbox.local:9090"
        icon: "fas fa-fire"

      - name: "OTel Collector"
        subtitle: "gRPC :4317 · HTTP :4318"
        tag: "OTLP"
        icon: "fas fa-satellite-dish"


  - name: "Databases"
    icon: "fas fa-database"
    items:
      - name: "MongoDB"
        subtitle: "mongodb://devbox.local:27017"
        tag: ":27017"
        icon: "fas fa-leaf"

      - name: "ClickHouse"
        subtitle: "default / clickhouse"
        tag: ":8123"
        icon: "fas fa-bolt"

      - name: "Redis"
        subtitle: "devbox.local:6379"
        tag: ":6379"
        icon: "fas fa-memory"

      - name: "Redpanda"
        subtitle: "Kafka :19092 · Schema :18081 · Proxy :18082"
        tag: ":19092"
        icon: "fas fa-stream"

      - name: "MySQL Primary"
        subtitle: "root / root"
        tag: ":3306"
        icon: "fas fa-database"

      - name: "MySQL Replica"
        subtitle: "root / root · read-only"
        tag: ":3307"
        icon: "fas fa-clone"
